# Countries, states, organizations and other values of the catalog COUNTRY / owner columns.
#
# One entry per canonical code (the GCAT state code where one exists). Every other raw
# code that means the same thing is an alias. See README.md for the field reference and
# SEEDING-NOTES.md for where each value came from.
#
#   code        canonical code (always quoted: 'NO' and 'N' are booleans in YAML 1.1)
#   aliases     every other raw code for this entry (Space-Track, legacy KeepTrack, dirty values)
#   name        English display name (other languages: i18n/countries.<lang>.yaml)
#   flag        flag-icons code (us, gb-sct), custom:<id> (cis su nato esa iss), or null
#   group       display group (hub page / filter menu); the head entry's name slugifies to it.
#               null only for kind special (never gets a page)
#   kind        state | org | historical | special
#   period      historical only, "YYYY-YYYY"
#   successors  historical only, canonical codes
#   legacyNames former English spellings, kept only for countries.by-name.en.json

