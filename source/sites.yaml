# Launch sites. One entry per canonical site (the GCAT site code; GCAT codes carry the era,
# e.g. NIIP-5 is Soviet-era Baikonur and GIK-5 Russian-era Baikonur). Space-Track and legacy
# KeepTrack codes are aliases. Seeded from the GCAT sites table for every site that has
# hosted an orbital or deep-space launch; see SEEDING-NOTES.md.
#
#   code     canonical code (quoted)
#   aliases  Space-Track / legacy KeepTrack codes for the same site
#   name     English display name
#   state    canonical country code from countries.yaml (the attributed state, following
#            GCAT: the operating nation for some sites, e.g. GIK-5 Baikonur -> RU)
#   lat/lon  decimal degrees (GCAT coordinates)
#   wiki     English Wikipedia URL or null

